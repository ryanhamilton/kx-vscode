name: CI

on:
  pull_request:
  push:
    branches: [dev]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx eslint --no-warn-ignored
      - run: npx tsc --noEmit --strict false
      - name: Rebrand table applied
        run: node tools/rebrand.mjs --check
      - name: Files added since the fork carry the peachq header
        run: node tools/headers.mjs --check
      - run: npm run build

  unit:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # macOS runs in ci-macos.yml, where a newer push cannot cancel it.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Unit tests with coverage
        if: runner.os == 'Linux'
        run: npm run coverage
        env:
          HEADLESS: 1
      - name: Unit tests
        if: runner.os != 'Linux'
        run: npm test
      - name: Upload coverage report
        if: runner.os == 'Linux' && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: coverage-reports/
          retention-days: 14

  e2e:
    name: End to end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          HEADLESS: 1
      - name: End to end tests beside a fake KX extension
        run: npm run test:e2e:kx
        env:
          HEADLESS: 1
      - name: End to end tests with no q installed but the bundled peachq
        run: npm run test:e2e:bare
        env:
          HEADLESS: 1
      - name: Read the pinned peachq build
        id: peachq-version
        run: echo "version=$(cat .peachq-version)" >> "$GITHUB_OUTPUT"
      - uses: peachq-org/setup-peachq@79cbbe80c40ee7450a2f9bb6db16d64b5b08946c # v1.0.0
        with:
          version: ${{ steps.peachq-version.outputs.version }}
      - name: REPL contract on peachq
        run: npm run test:e2e:peachq
        env:
          HEADLESS: 1
      - name: Scripts loaded with \l against the whole-file command on peachq
        run: npm run test:l-diff
        env:
          HEADLESS: 1

  package:
    name: Package the per-platform and universal vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run package:targets
      - name: Only the targeted vsix carry peachq
        run: |
          version=$(node -p 'require("./package.json").version')
          unzip -l "dist/peachq-linux-x64-$version.vsix" | grep -q ' extension/bin/peachq/linux-x64/q$'
          ! unzip -l "dist/peachq-$version.vsix" | grep -q 'extension/bin/'
      - name: Every vsix carries NOTICE
        run: for f in dist/*.vsix; do unzip -l "$f" | grep -q ' extension/NOTICE$'; done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: dist/*.vsix
          retention-days: 14

  qunit:
    name: q tests (qunit on peachq)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the pinned peachq build
        id: peachq-version
        run: echo "version=$(cat .peachq-version)" >> "$GITHUB_OUTPUT"
      - uses: peachq-org/setup-peachq@79cbbe80c40ee7450a2f9bb6db16d64b5b08946c # v1.0.0
        with:
          version: ${{ steps.peachq-version.outputs.version }}
      - run: npm run q-test
      - name: A failing qunit file makes the runner exit non-zero
        run: '! "$PEACHQ_Q" test/q/run.q test/q/qunit-fixture -classic < /dev/null'
      - name: The q render fixture is what the pinned peachq prints
        run: |
          npm run gen:q-render
          git diff --exit-code test/fixtures/q-render
          test -z "$(git status --porcelain test/fixtures/q-render)"

  manual-test-smoke:
    name: Manual-test walkthrough (headless, peachq)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/manual-test/package-lock.json
      - name: Read the pinned peachq build
        id: peachq-version
        run: echo "version=$(cat .peachq-version)" >> "$GITHUB_OUTPUT"
      - uses: peachq-org/setup-peachq@79cbbe80c40ee7450a2f9bb6db16d64b5b08946c # v1.0.0
        with:
          version: ${{ steps.peachq-version.outputs.version }}
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: tools/manual-test
      - run: node smoke.ts
        working-directory: tools/manual-test
        env:
          HEADLESS: 1
      - run: node tools/fetch-peachq.mjs
      - name: Walkthrough on the built-in peachq connection
        run: node smoke.ts --builtin
        working-directory: tools/manual-test
        env:
          HEADLESS: 1
      - name: Upload the walkthrough screenshot
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manual-test-smoke
          path: |
            tools/manual-test/.work/shots/
            tools/manual-test/.work/driver.log
          retention-days: 14
          include-hidden-files: true
