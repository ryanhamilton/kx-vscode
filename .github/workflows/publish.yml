name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish (must equal package.json's)
        required: true
        type: string
      dry_run:
        description: Dry run (build, check and approve, publish nothing)
        type: boolean
        default: true
      open_vsx:
        description: Also publish to Open VSX (off only while its first version is published by hand)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

env:
  VERSION: ${{ inputs.version }}
  DRY_RUN: ${{ inputs.dry_run }}

jobs:
  build:
    name: Build and check the vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - name: The version is package.json's, and a real run is a release from dev
        run: |
          actual=$(node -p 'require("./package.json").version')
          if [ "$VERSION" != "$actual" ]; then
            echo "::error::version input $VERSION is not package.json's $actual"
            exit 1
          fi
          if [ "$DRY_RUN" != true ]; then
            case "$VERSION" in *-*)
              echo "::error::$VERSION is a prerelease, which the Marketplace refuses"
              exit 1
            esac
            if [ "$GITHUB_REF" != refs/heads/dev ]; then
              echo "::error::real publishes run from dev, not $GITHUB_REF"
              exit 1
            fi
          fi
      - run: npm ci
      - run: npm run package:targets
      - name: Checksums
        run: |
          (cd dist && sha256sum ./*.vsix) | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix-${{ inputs.version }}
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 30

  release:
    name: Draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.dry_run && format('dry-run-{0}', github.run_id) || format('v{0}', inputs.version) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix-${{ inputs.version }}
          path: dist
      - name: Create or update the draft
        run: |
          if draft=$(gh release view "$TAG" --json isDraft,targetCommitish \
              --jq '"\(.isDraft) \(.targetCommitish)"' 2>/dev/null); then
            if [ "$draft" != "true $GITHUB_SHA" ]; then
              echo "::error::$TAG is released, or drafted from another commit ($draft): delete the draft or bump the version"
              exit 1
            fi
            gh release upload "$TAG" dist/*.vsix --clobber
          else
            gh release create "$TAG" dist/*.vsix --draft --target "$GITHUB_SHA" \
              --title "$TAG" --notes "peachq $VERSION. See CHANGELOG.md."
          fi
          built=$(find dist -maxdepth 1 -name '*.vsix' | wc -l)
          assets=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$assets" -ne "$built" ]; then
            echo "::error::draft $TAG holds $assets assets, not the $built vsix"
            exit 1
          fi
          echo "Draft release $TAG holds the $built vsix" >> "$GITHUB_STEP_SUMMARY"
      - name: Delete the dry-run draft
        if: always() && inputs.dry_run
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release delete "$TAG" --yes
          fi

  publish:
    name: Publish to the Marketplace and Open VSX
    needs: [build, release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      # ovsx prefers OVSX_PAT to trusted publishing; vsce --oidc ignores VSCE_PAT.
      VSCE_PAT: ""
      OVSX_PAT: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - run: npm ci --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix-${{ inputs.version }}
          path: dist
      - name: What this run publishes
        run: |
          verb=$([ "$DRY_RUN" = true ] && echo "Would publish" || echo "Publishing")
          for file in dist/*.vsix; do
            identity=$(unzip -p "$file" extension.vsixmanifest | grep -o '<Identity [^>]*>')
            echo "$verb $(basename "$file"): $identity" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: The OIDC token the Marketplace would get (claims only)
        if: inputs.dry_run
        run: |
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=marketplace.visualstudio.com" | jq -r .value)
          echo "::add-mask::$token"
          node -e '
            const claims = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url"));
            for (const key of ["repository", "repository_owner", "workflow_ref", "environment", "ref", "aud"]) {
              console.log(key + ": " + claims[key]);
            }' "$token"
      - name: Publish to the Marketplace
        if: ${{ !inputs.dry_run }}
        run: |
          for file in dist/*.vsix; do
            npx vsce publish --oidc --skip-duplicate --packagePath "$file"
          done
      - name: Publish to Open VSX
        if: ${{ !inputs.dry_run && inputs.open_vsx }}
        run: |
          for file in dist/*.vsix; do
            npx ovsx publish "$file" --trusted-publishing --skip-duplicate
          done
