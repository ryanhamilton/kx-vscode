name: No tool names

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check PR title, body and commit messages
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          pattern='claude|codex|anthropic|astra|fable|co-authored-by'
          scan() { sed 's/CLAUDE\.md//g' | grep -Eiwq "$pattern"; }
          status=0
          for part in TITLE BODY; do
            if printf '%s' "${!part}" | scan; then
              echo "::error::PR ${part,,} names a tool or model"
              status=1
            fi
          done
          messages=$(git log --format=%B "$BASE..$HEAD") || exit 1
          if printf '%s' "$messages" | scan; then
            echo "::error::a commit message names a tool or model"
            status=1
          fi
          exit $status
